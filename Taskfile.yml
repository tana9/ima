version: '3'

vars:
  CLASP: npx --yes --package=@google/clasp@3 clasp

tasks:
  default:
    desc: 利用できる操作を一覧表示する
    cmds:
      - task --list

  test:
    desc: 日本語のテストを実行する
    cmds:
      - node --test tests/*.test.cjs

  setup:browser:
    desc: ブラウザテストの依存パッケージとChromiumを準備する
    cmds:
      - npm ci
      - npx --no-install playwright install chromium

  test:browser:
    desc: デスクトップとスマートフォンの画面で操作を検証する
    cmds:
      - npx --no-install playwright test

  test:all:
    desc: 単体テストと実ブラウザテストを順番に実行する
    cmds:
      - task: test
      - task: test:browser

  preview:
    desc: ローカルのサンプルデータでHTMLをプレビューする
    vars:
      PORT: '{{default "3000" .PORT}}'
    env:
      PREVIEW_PORT: '{{.PORT}}'
    cmds:
      - node scripts/preview.cjs

  login:
    desc: Googleアカウントでclaspにログインする
    cmds:
      - '{{.CLASP}} login'

  status:
    desc: Apps Scriptへの反映対象ファイルを確認する
    cmds:
      - '{{.CLASP}} show-file-status'

  push:
    desc: テスト成功後にソースをApps Scriptへ反映する
    cmds:
      - task: test
      - '{{.CLASP}} push --force'

  deployments:
    desc: デプロイIDと公開バージョンを一覧表示する
    cmds:
      - '{{.CLASP}} list-deployments'

  deploy:
    desc: テストとソース反映後、指定した既存デプロイを更新する
    requires:
      vars: [DEPLOYMENT_ID]
    env:
      IMA_DEPLOYMENT_ID: '{{.DEPLOYMENT_ID}}'
    cmds:
      - task: push
      - '{{.CLASP}} update-deployment "$IMA_DEPLOYMENT_ID"'

  deploy:new:
    desc: テストとソース反映後、新しいデプロイを作成する
    cmds:
      - task: push
      - '{{.CLASP}} create-deployment'

  open:
    desc: Apps Scriptエディタをブラウザで開く
    cmds:
      - '{{.CLASP}} open-script'
